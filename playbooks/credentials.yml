---
# Runs on: workstation only (contacts no host). Writes the environment's connection sheet, including all passwords,
# to a 0600 file outside the repository and prints it:
#   make credentials ENV=<env>
- name: Connection sheet with credentials
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    credentials_file: "{{ lookup('ansible.builtin.env', 'HOME') }}/.ansible/vault/pgc-{{ pgc_env }}-credentials.txt"
  tasks:
    # Role defaults are loaded into their own namespaces, so they can't override inventory values
    - name: Read role defaults (user names, ports)
      ansible.builtin.include_vars:
        file: "../roles/{{ item }}/defaults/main.yml"
        name: "credentials_{{ item }}"
      loop: [patroni, pgbouncer, postgres_exporter, haproxy]

    # Read-only; the git module has no equivalent of rev-parse
    - name: Find the Git repository root   # noqa: command-instead-of-module
      ansible.builtin.command: git -C "{{ playbook_dir }}" rev-parse --show-toplevel
      register: credentials_repo
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Refuse to write inside the repository
      ansible.builtin.assert:
        that:
          - not (credentials_file | realpath).startswith(credentials_repo_root ~ '/')
        fail_msg: "credentials_file must be outside the repository: {{ credentials_file }}"
        quiet: true
      vars:
        credentials_repo_root: "{{ credentials_repo.stdout if credentials_repo.rc == 0 else ((playbook_dir ~ '/..') | realpath) }}"

    - name: Write the connection sheet (0600)
      ansible.builtin.template:
        src: templates/credentials.txt.j2
        dest: "{{ credentials_file }}"
        mode: "0600"
      diff: false
      no_log: true

    - name: Where it is
      ansible.builtin.debug:
        msg: "Written to {{ credentials_file }} (mode 0600). It contains passwords: don't commit, mail or paste it."
