---
- name: Restart node_exporter
  ansible.builtin.systemd_service:
    name: node_exporter
    state: restarted
    daemon_reload: true
  when: not ansible_check_mode   # the unit does not exist yet in a dry run

- name: Restart postgres_exporter
  ansible.builtin.systemd_service:
    name: postgres_exporter
    state: restarted
    daemon_reload: true
  when: not ansible_check_mode   # the unit does not exist yet in a dry run

- name: Restart pgbouncer_exporter
  ansible.builtin.systemd_service:
    name: pgbouncer_exporter
    state: restarted
    daemon_reload: true
  when: not ansible_check_mode   # the unit does not exist yet in a dry run
