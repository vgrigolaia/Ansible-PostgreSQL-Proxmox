---
# Runs on: pgdb0x-<env>
# Declarative firewall: the whole zone and egress policy are XML files rendered from the inventory.
# Reload keeps established connections (the running SSH session survives).

- name: Assert admin networks are defined
  ansible.builtin.assert:
    that:
      - admin_cidrs | length > 0
      - pgc_foreign_ips | length > 0
    fail_msg: "admin_cidrs is empty (would lock out SSH) or no foreign environment IPs are known."
    quiet: true

- name: Guard - every connected SSH client is in an admin network (prevents lockout)
  ansible.builtin.command:
    argv: "{{ ['python3', '-c', firewall_guard_script] + admin_cidrs }}"
  vars:
    # SSH_CLIENT is not visible to modules, so read the established connections on port 22 instead.
    firewall_guard_script: |
      import ipaddress, subprocess, sys
      out = subprocess.run(["ss", "-tnH", "state", "established", "( sport = :22 )"],
                           capture_output=True, text=True, check=True).stdout
      peers = set()
      for line in out.splitlines():
          f = line.split()
          if len(f) < 4:
              continue
          host = f[3].rsplit(":", 1)[0].strip("[]")
          if host.startswith("::ffff:"):
              host = host[7:]
          peers.add(ipaddress.ip_address(host))
      nets = [ipaddress.ip_network(c, strict=False) for c in sys.argv[1:]]
      outside = sorted(str(p) for p in peers if not any(p in n for n in nets))
      print("peers=" + ",".join(sorted(map(str, peers))) + " outside=" + ",".join(outside))
      sys.exit(4 if not peers else (3 if outside else 0))
  register: firewall_ssh_client
  changed_when: false
  failed_when: false
  check_mode: false

- name: Show lockout guard result
  ansible.builtin.debug:
    msg:
      rc: "{{ firewall_ssh_client.rc | default('n/a') }}"
      source: "{{ firewall_ssh_client.stdout | default('') }}"
      stderr: "{{ firewall_ssh_client.stderr | default('') }}"
      module_msg: "{{ firewall_ssh_client.msg | default('') }}"

- name: Fail if the SSH source would be locked out
  ansible.builtin.assert:
    that:
      - firewall_ssh_client.rc == 0
    fail_msg: >-
      Lockout guard (rc={{ firewall_ssh_client.rc }}): {{ firewall_ssh_client.stdout | default('') }}.
      Every connected SSH client must be inside admin_cidrs {{ admin_cidrs }}.
      {{ firewall_ssh_client.stderr | default('') | trim }} Applying the firewall could lock SSH out. Nothing was changed.
    quiet: true

- name: Enable firewalld
  ansible.builtin.systemd_service:
    name: firewalld
    enabled: true
    state: started

- name: Write zone {{ firewall_zone }}
  ansible.builtin.template:
    src: zone.xml.j2
    dest: "/etc/firewalld/zones/{{ firewall_zone }}.xml"
    mode: "0644"
    validate: python3 -c "import sys, xml.dom.minidom; xml.dom.minidom.parse(sys.argv[1])" %s
  register: firewall_zone_file

- name: Write egress policy {{ firewall_egress_policy }}
  ansible.builtin.template:
    src: policy.xml.j2
    dest: "/etc/firewalld/policies/{{ firewall_egress_policy }}.xml"
    mode: "0644"
    validate: python3 -c "import sys, xml.dom.minidom; xml.dom.minidom.parse(sys.argv[1])" %s
  register: firewall_policy_file

- name: Set the default zone - {{ firewall_zone }}
  ansible.builtin.lineinfile:
    path: /etc/firewalld/firewalld.conf
    regexp: '^DefaultZone='
    line: "DefaultZone={{ firewall_zone }}"
  register: firewall_default_zone

- name: Validate the permanent firewalld configuration
  ansible.builtin.command: firewall-cmd --check-config
  changed_when: false
  when: not ansible_check_mode

- name: Reload firewalld
  ansible.builtin.command: firewall-cmd --reload
  changed_when: true
  when: firewall_zone_file is changed or firewall_policy_file is changed or firewall_default_zone is changed

- name: Read the zone of the primary interface
  ansible.builtin.command: firewall-cmd --get-zone-of-interface={{ ansible_facts['default_ipv4']['interface'] }}
  register: firewall_iface_zone
  changed_when: false
  failed_when: false
  check_mode: false

- name: Show the zone of the primary interface
  ansible.builtin.debug:
    msg: "{{ ansible_facts['default_ipv4']['interface'] }} is in zone '{{ firewall_iface_zone.stdout | trim }}' (expected {{ firewall_zone }} after reload)"

- name: Assert the primary interface is in {{ firewall_zone }}
  ansible.builtin.assert:
    that:
      - firewall_iface_zone.stdout | trim == firewall_zone
    fail_msg: >-
      {{ ansible_facts['default_ipv4']['interface'] }} is in zone '{{ firewall_iface_zone.stdout | trim }}', not {{ firewall_zone }}
      (probably bound explicitly by NetworkManager). Its old zone still applies; nothing is locked out.
    quiet: true
  when: not ansible_check_mode

- name: Confirm SSH still works through the new firewall (new connection)
  ansible.builtin.wait_for_connection:
    timeout: 60
  when: not ansible_check_mode
