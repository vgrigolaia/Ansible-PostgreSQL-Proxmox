---
# Read-only: guards + plan for one VM. Runs for ALL VMs before any VM is changed.
- name: Look up and guard - {{ vm_host }}
  ansible.builtin.include_tasks: lookup.yml

# A new VM must not get an address another machine already answers on: its NIC would come up without an IP
# (address conflict) and SSH would reach the other machine.
- name: Probe IP of the not yet existing VM - {{ vm_host }}
  ansible.builtin.command: ping -c 2 -W 1 {{ proxmox_vm_ip }}
  register: proxmox_vm_ip_probe
  changed_when: false
  failed_when: false
  check_mode: false    # read-only, needed in --check too
  when: proxmox_vm_existing.proxmox_vms | length == 0

- name: Guard - IP of a new VM must be unused - {{ vm_host }}
  ansible.builtin.assert:
    that:
      - proxmox_vm_existing.proxmox_vms | length > 0 or proxmox_vm_ip_probe.rc != 0
    fail_msg: >-
      {{ proxmox_vm_ip }} answers ping, but VM {{ proxmox_vm_id }} ({{ vm_host }}) doesn't exist yet: another machine
      uses this address. Pick a free IP (inventory, host_vars, environments.yml). Nothing was changed.
    quiet: true

- name: Remember existing VMs - {{ vm_host }}
  ansible.builtin.set_fact:
    proxmox_vm_existing_hosts: "{{ (proxmox_vm_existing_hosts | default([])) + [vm_host] }}"
  when: proxmox_vm_existing.proxmox_vms | length > 0

- name: Plan for {{ vm_host }}
  ansible.builtin.debug:
    msg:
      - "VM {{ proxmox_vm_id }} {{ vm_host }}: {{ proxmox_vm_action }}"
      - "node={{ proxmox_vm_node }} storage={{ pve_storage }} pool={{ pve_pool }} cpu={{ vm_cpu_type }} cores={{ vm_cores }} memory={{ vm_memory_mb }}MB"
      - "ip={{ proxmox_vm_ip }}/{{ net_prefix }} gw={{ net_gateway }} dns={{ net_dns_servers | join(',') }} user={{ vm_ci_user }}"
      - "controller={{ vm_scsihw }} disks: {{ vm_os_disk_slot }} OS {{ vm_os_disk_gb }}G; {{ proxmox_vm_disk_summary }}"
      - "{{ proxmox_vm_ha_plan }}"
  vars:
    proxmox_vm_ha_plan: >-
      {{ ('ha: resource vm:' ~ proxmox_vm_id ~ ' state=started max_restart=' ~ pve_ha_max_restart
          ~ ' max_relocate=' ~ pve_ha_max_relocate ~ '; rule ' ~ proxmox_vm_ha_rule
          ~ ' node-affinity ' ~ proxmox_vm_node ~ ' non-strict (failback)')
         if pve_ha_enabled | bool else 'ha: off (VM started directly)' }}
    proxmox_vm_action: >-
      {{ ('exists on ' ~ proxmox_vm_existing.proxmox_vms[0].node ~ ', will update config')
         if proxmox_vm_existing.proxmox_vms else ('will full-clone from ' ~ pve_template_vmid) }}
    proxmox_vm_disk_summary: >-
      {{ vm_pg_disks | map(attribute='slot')
         | zip(vm_pg_disks | map(attribute='name'), vm_pg_disks | map(attribute='size_gb'))
         | map('join', ' ') | join('G; ') }}G
