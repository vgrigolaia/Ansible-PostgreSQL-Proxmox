---
# Runs on: workstation (localhost) against the Proxmox API.
# Creates/updates the VMs of the current environment only. Never deletes or stops anything.

- name: Assert environment settings are complete
  ansible.builtin.assert:
    that:
      - pve_api_host | default('', true) | string | length > 0
      - "'!' in pve_api_token_id"
      - net_prefix | int > 0
      - net_gateway | default('', true) | string | length > 0
      - net_dns_servers | length > 0
      - vm_cores | int > 0
      - vm_memory_mb | int > 0
      - vm_os_disk_gb | int > 0
      - vm_pg_disks | map(attribute='size_gb') | select('none') | list | length == 0
      - vm_ci_ssh_keys | length > 0
    fail_msg: "Missing values in inventories/{{ pgc_env }} (network, sizing, disk sizes, API token or SSH keys)."
    quiet: true

# HA rules (node-affinity) exist since Proxmox VE 9.0; on 8.x the rule API is missing.
- name: Read Proxmox VE version
  ansible.builtin.uri:
    url: "https://{{ pve_api_host }}:8006/api2/json/version"
    headers:
      Authorization: "PVEAPIToken={{ pve_api_token_id }}={{ pve_api_token_secret }}"
    validate_certs: "{{ pve_api_validate_certs }}"
  register: proxmox_vm_pve_version
  check_mode: false    # read-only GET, needed for the check below in --check runs too
  no_log: true         # the request carries the token secret
  when: pve_ha_enabled | bool

- name: Assert Proxmox VE 9 or newer for HA rules
  ansible.builtin.assert:
    that:
      - proxmox_vm_pve_version.json.data.version.split('.')[0] | int >= 9
    fail_msg: >-
      pve_ha_enabled needs Proxmox VE 9 or newer (HA node-affinity rules); the cluster runs
      {{ proxmox_vm_pve_version.json.data.version }}. Upgrade or set pve_ha_enabled: false.
    quiet: true
  when: pve_ha_enabled | bool

# Checked before any change, so a missing HA privilege can't leave a VM cloned but not started.
- name: Read the token's own privileges on /
  ansible.builtin.uri:
    url: "https://{{ pve_api_host }}:8006/api2/json/access/permissions?path=/"
    headers:
      Authorization: "PVEAPIToken={{ pve_api_token_id }}={{ pve_api_token_secret }}"
    validate_certs: "{{ pve_api_validate_certs }}"
  register: proxmox_vm_pve_perms
  check_mode: false    # read-only GET
  no_log: true         # the request carries the token secret
  when: pve_ha_enabled | bool

# The API maps privilege => propagate flag; with --propagate 0 the value is 0 but the privilege is granted.
- name: Assert the token may manage Proxmox HA (Sys.Audit + Sys.Console on /)
  ansible.builtin.assert:
    that:
      - "'Sys.Audit' in proxmox_vm_pve_perms.json.data['/'] | default({})"
      - "'Sys.Console' in proxmox_vm_pve_perms.json.data['/'] | default({})"
    fail_msg: >-
      Token {{ pve_api_token_id }} lacks Sys.Audit and/or Sys.Console on / (has:
      {{ proxmox_vm_pve_perms.json.data['/'] | default({}) | list | sort | join(', ') or 'nothing' }}).
      Grant role PGC-HA on / to the user, and also to the token if it has privsep 1 (DEPLOYMENT.md section 4.2),
      or set pve_ha_enabled: false. Nothing was changed.
    quiet: true
  when: pve_ha_enabled | bool

- name: Look up template {{ pve_template_vmid }}
  community.proxmox.proxmox_vm_info:
    vmid: "{{ pve_template_vmid }}"
    type: qemu
    config: current
  register: proxmox_vm_template

- name: Assert the template exists and is a template - {{ pve_template_vmid }}
  ansible.builtin.assert:
    that:
      - proxmox_vm_template.proxmox_vms | length == 1
      - proxmox_vm_template.proxmox_vms[0].template | bool
      - proxmox_vm_template.proxmox_vms[0].name == proxmox_vm_template_name
      - "'pgc' in (proxmox_vm_template.proxmox_vms[0].config.tags | default('')).split(';')"
    fail_msg: "Template {{ pve_template_vmid }} missing or not ours ({{ proxmox_vm_template_name }}, tag pgc). Run --tags template first."
    quiet: true

# Two passes: every VM is checked (read-only) before any VM is changed,
# so a conflict on one VM can never leave another one half-modified.
- name: Check every VM before changing anything
  ansible.builtin.include_tasks: check.yml
  loop: "{{ groups['pg_nodes'] }}"
  loop_control:
    loop_var: vm_host

# The VIP only comes up later (keepalived). For a new environment nothing may answer on it yet;
# once any VM of the environment exists, the VIP may legitimately be up.
- name: Probe the VIP of the new environment - {{ cluster_vip }}
  ansible.builtin.command: ping -c 2 -W 1 {{ cluster_vip }}
  register: proxmox_vm_vip_probe
  changed_when: false
  failed_when: false
  check_mode: false    # read-only, needed in --check too
  when: proxmox_vm_existing_hosts | default([]) | length == 0

- name: Guard - VIP of a new environment must be unused
  ansible.builtin.assert:
    that:
      - proxmox_vm_vip_probe.rc != 0
    fail_msg: >-
      VIP {{ cluster_vip }} answers ping, but no VM of {{ pgc_env }} exists yet: another machine uses it.
      Pick a free VIP in environments.yml. Nothing was changed.
    quiet: true
  when: proxmox_vm_existing_hosts | default([]) | length == 0

- name: Provision each VM
  ansible.builtin.include_tasks: vm.yml
  loop: "{{ groups['pg_nodes'] }}"
  loop_control:
    loop_var: vm_host
